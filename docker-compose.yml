# Run the whole stack locally:  docker compose up --build
# Secrets come from a .env file next to this one (see .env.example)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: minimus
      POSTGRES_PASSWORD: minimus
      POSTGRES_DB: minimus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minimus"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./Backend
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://minimus:minimus@db:5432/minimus
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      OMDB_API_KEY: ${OMDB_API_KEY:?set OMDB_API_KEY in .env}
      TMDB_API_KEY: ${TMDB_API_KEY:?set TMDB_API_KEY in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "3002:3002"

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: http://localhost:3002/api
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
